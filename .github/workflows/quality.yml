name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/school-cbt-subscription]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
        env:
          # Build must not need production secrets; use placeholders only if Vite validates these at build time.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-build-placeholder
