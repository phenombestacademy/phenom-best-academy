name: Repair password auth session handling

on:
  push:
    paths:
      - 'scripts/repair_auth.py'
      - '.github/workflows/fix-auth-password-session.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply authentication repair
        run: python scripts/repair_auth.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit repaired authentication flow
        run: |
          git config user.name 'Phenom Best Academy Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/platform.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist verified auth session before password update'
          git push
